[project]
name = "p2p"
version = "0.1.0"
description = "P2P communication with QUIC, KCP and Cloudflare TURN"
readme = "README.md"
authors = [
    { name = "水灵", email = "1668589925@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aioquic>=1.2.0",
    "aiortc>=1.9.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "python-socketio>=5.11.0",
    "pydantic>=2.6.0",
    "loguru>=0.7.2",
]

[project.scripts]
p2p = "p2p.main:main"
p2p-signaling = "p2p.signaling_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
